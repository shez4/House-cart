# Self-host House-cart with Docker (alternative to deploying on Vercel).
# Runs the app plus its own Postgres database.
#   cp .env.example .env   # POSTGRES_URL is set for you below; fill in the rest
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-housecart}
      POSTGRES_USER: housecart
      POSTGRES_DB: housecart
    volumes:
      - housecart_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housecart"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  house-cart:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_URL=postgres://housecart:${POSTGRES_PASSWORD:-housecart}@db:5432/housecart
      # Optional — see .env.example
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HOUSECART_CURRENCY=${HOUSECART_CURRENCY:-}
      - HOUSECART_PARSE_MODEL=${HOUSECART_PARSE_MODEL:-claude-haiku-4-5}
    restart: unless-stopped

volumes:
  housecart_db:
