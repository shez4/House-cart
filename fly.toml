# Fly.io deployment config for House-cart.
#
# One-time setup (install flyctl first: https://fly.io/docs/flyctl/install):
#   fly launch --no-deploy                       # creates the app, keep this file
#   fly postgres create                          # creates a Postgres cluster
#   fly postgres attach <db-name>                # sets DATABASE_URL for the app
#   fly secrets set GOOGLE_CLIENT_ID=...          # (optional)
#   fly deploy

app = "house-cart"
primary_region = "lhr"   # change to a region near you: `fly platform regions`

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # scales to zero when idle; bump to 1 for no cold starts

# Data lives in Postgres (attach one with `fly postgres attach`), so no volume
# is needed here.
